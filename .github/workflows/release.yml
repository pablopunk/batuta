name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches VERSION
        if: env.PUBLISH == 'true'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

      - name: Import the signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: bash scripts/ci/import-signing-certificate.sh

      - name: Store the notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/ci/store-notary-credentials.sh

      - name: Build, sign and notarize
        run: make build-release

      - name: Check the notarized app
        run: |
          spctl --assess --type execute --verbose=2 .build/release/Batuta.app
          xcrun stapler validate .build/release/Batuta.app

      - name: Write the Sparkle key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          echo "SPARKLE_PRIVATE_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Check the Sparkle key matches the app
        run: bash scripts/ci/check-sparkle-key.sh dist/Batuta.zip

      - name: Keep the build (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Batuta-dry-run
          path: dist/

      - name: Publish the release and appcast
        if: env.PUBLISH == 'true'
        run: bash scripts/publish-release.sh "$GITHUB_REF_NAME"

      - name: Update the Homebrew cask
        if: env.PUBLISH == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash scripts/update-homebrew-cask.sh "${GITHUB_REF_NAME#v}" "$PWD/dist/Batuta.zip"

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/sparkle-private-key"
